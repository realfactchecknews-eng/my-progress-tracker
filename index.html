<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заметки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A84C;
            --gold-l: #E2C47A;
            --gold-dim: rgba(201,168,76,0.1);
            --gold-bd: rgba(201,168,76,0.25);
            --bg: #080808;
            --s1: #0f0f0f;
            --s2: #161616;
            --text: #F0EDE8;
            --muted: #555;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.6; overflow-x: hidden;
        }

        /* ─── INTRO ─── */
        #intro {
            position: fixed; inset: 0; z-index: 1000;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
        }
        .particle {
            position: absolute; border-radius: 50%;
            background: var(--gold); opacity: 0;
            animation: fp 3s ease-in-out infinite;
        }
        @keyframes fp {
            0%   { opacity:0; transform:translateY(0) scale(.5); }
            30%  { opacity:.6; }
            100% { opacity:0; transform:translateY(-130px) scale(1); }
        }
        #intro-label {
            font-size:.65rem; letter-spacing:.28em;
            text-transform:uppercase; color:var(--muted); font-weight:400;
        }
        #rw { position:relative; width:280px; height:280px; }
        #rw::before {
            content:'';
            position:absolute; top:-15px; left:50%; transform:translateX(-50%);
            border-left:9px solid transparent; border-right:9px solid transparent;
            border-top:17px solid var(--gold); z-index:10;
            filter:drop-shadow(0 0 8px var(--gold));
        }
        #rc { width:280px; height:280px; border-radius:50%;
            box-shadow:0 0 50px rgba(201,168,76,.2),0 0 100px rgba(201,168,76,.08); }
        #rn {
            font-size:5.5rem; font-weight:200; color:var(--gold);
            letter-spacing:.12em;
            text-shadow:0 0 40px var(--gold),0 0 80px rgba(201,168,76,.4);
            opacity:0; transform:scale(.4);
            transition:opacity .5s,transform .5s;
        }
        #rn.on { opacity:1; transform:scale(1); }
        #rl {
            font-size:.62rem; letter-spacing:.3em; text-transform:uppercase;
            color:var(--gold); opacity:0; transition:opacity .5s .3s;
        }
        #rl.on { opacity:.75; }
        #skip {
            padding:10px 36px; background:transparent;
            border:1px solid var(--gold-bd); color:var(--gold);
            font-family:inherit; font-size:.75rem;
            letter-spacing:.15em; text-transform:uppercase;
            cursor:pointer; opacity:0; transition:opacity .4s .5s,background .2s;
        }
        #skip.on { opacity:1; }
        #skip:hover { background:var(--gold-dim); }
        #intro.bye { animation:fadeOut .8s forwards; }
        @keyframes fadeOut { to { opacity:0; pointer-events:none; } }

        /* ─── DANCER ─── */
        .dancer {
            position:fixed; bottom:22px; left:22px; z-index:900;
            cursor:pointer; user-select:none;
            transition:none;
        }
        .dancer svg { width:46px; height:70px; overflow:visible; }
        .dancer .pa { display:block; }
        .dancer .pb { display:none; }
        .dancer.alt .pa { display:none; }
        .dancer.alt .pb { display:block; }
        .dancer { animation:dbounce .42s steps(1) infinite; }
        @keyframes dbounce {
            0%  { transform:translateY(0); }
            50% { transform:translateY(-7px); }
            100%{ transform:translateY(0); }
        }
        .dancer.falling {
            animation:dfall .9s ease-in forwards !important;
        }
        @keyframes dfall {
            0%  { transform:translateY(0) rotate(0deg); opacity:1; }
            40% { transform:translateY(20px) rotate(30deg); opacity:.9; }
            70% { transform:translateY(60px) rotate(75deg); opacity:.5; }
            100%{ transform:translateY(130px) rotate(100deg); opacity:0; }
        }
        .dancer-tag {
            text-align:center; font-size:.52rem;
            color:var(--muted); letter-spacing:.1em; margin-top:3px;
        }

        /* ─── MAIN ─── */
        #app { opacity:0; transition:opacity .7s; }
        #app.on { opacity:1; }
        .wrap { max-width:800px; margin:0 auto; padding:56px 24px 0; }

        /* header */
        header { text-align:center; margin-bottom:44px; }
        .hdeco {
            display:flex; align-items:center; justify-content:center;
            gap:18px; margin-bottom:10px;
        }
        .hdeco::before,.hdeco::after {
            content:''; flex:1; height:1px;
            background:linear-gradient(to right,transparent,var(--gold-bd));
        }
        .hdeco::after { background:linear-gradient(to left,transparent,var(--gold-bd)); }
        h1 { font-size:1.5rem; font-weight:300; letter-spacing:.22em;
             text-transform:uppercase; color:var(--gold); }
        .hsub { color:var(--muted); font-size:.78rem; letter-spacing:.06em; font-weight:300; }
        .lvl-badge {
            display:inline-flex; align-items:center; gap:10px;
            margin-top:14px; border:1px solid var(--gold-bd);
            padding:5px 16px; font-size:.68rem; letter-spacing:.1em; color:var(--gold);
            text-transform:uppercase;
        }
        .xp-track { width:100px; height:2px; background:#1e1e1e; }
        .xp-fill { height:100%; background:var(--gold); transition:width .6s ease; }
        .xp-txt { font-size:.6rem; color:var(--muted); }

        /* stats */
        .stats {
            display:grid; grid-template-columns:repeat(3,1fr);
            gap:1px; background:var(--gold-bd);
            border:1px solid var(--gold-bd); margin-bottom:30px;
        }
        .sc { background:var(--s1); padding:20px 12px; text-align:center; }
        .sn { display:block; font-size:1.9rem; font-weight:300;
              color:var(--gold); line-height:1; margin-bottom:5px; }
        .sl { color:var(--muted); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; }

        /* ─── GRAPH ─── */
        .graph-section {
            position:relative; margin-bottom:28px;
            border:1px solid var(--gold-bd);
            background:var(--s1);
        }
        .graph-toolbar {
            display:flex; align-items:center; justify-content:space-between;
            padding:10px 16px; border-bottom:1px solid #1a1a1a;
        }
        .graph-toolbar span {
            font-size:.62rem; letter-spacing:.18em;
            text-transform:uppercase; color:var(--gold);
        }
        .graph-hint { font-size:.6rem; color:var(--muted); font-weight:300; }

        #gc {
            display:block; width:100%;
            cursor:default;
        }

        /* node detail panel */
        #g-detail {
            display:none; padding:20px 24px;
            border-top:1px solid #1a1a1a;
            animation:slideIn .25s ease;
        }
        @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
        #g-detail .dc { font-size:.6rem; letter-spacing:.12em; text-transform:uppercase;
                        color:var(--gold); margin-bottom:6px; }
        #g-detail h3 { font-size:1rem; font-weight:500; margin-bottom:4px; }
        #g-detail .dd { font-size:.72rem; color:var(--muted); margin-bottom:10px; }
        #g-detail .db { font-size:.875rem; font-weight:300; color:#999; line-height:1.75; }
        #g-detail .da { margin-top:14px; display:flex; gap:8px; }
        .g-edit-btn,.g-close-btn {
            padding:5px 14px; background:transparent;
            font-family:inherit; font-size:.68rem; letter-spacing:.08em;
            text-transform:uppercase; cursor:pointer; transition:all .15s;
        }
        .g-edit-btn { border:1px solid var(--gold-bd); color:var(--gold); }
        .g-edit-btn:hover { background:var(--gold-dim); }
        .g-close-btn { border:1px solid #1e1e1e; color:var(--muted); }
        .g-close-btn:hover { border-color:#333; color:var(--text); }

        /* ─── CONTROLS ─── */
        .ctrl-row {
            display:flex; gap:8px; margin-bottom:20px; align-items:center;
        }
        .search-wrap { flex:1; position:relative; }
        .search-wrap svg {
            position:absolute; left:13px; top:50%; transform:translateY(-50%);
            color:var(--muted); pointer-events:none;
        }
        #si {
            width:100%; padding:10px 14px 10px 40px;
            background:var(--s1); border:1px solid #1a1a1a;
            color:var(--text); font-family:inherit; font-size:.875rem;
            font-weight:300; outline:none; transition:border-color .2s;
        }
        #si:focus { border-color:var(--gold-bd); }
        #si::placeholder { color:var(--muted); }

        #add-btn {
            padding:10px 20px; background:var(--gold); color:#000;
            border:none; font-family:inherit; font-size:.75rem; font-weight:600;
            letter-spacing:.12em; text-transform:uppercase; cursor:pointer;
            transition:background .2s; white-space:nowrap;
        }
        #add-btn:hover { background:var(--gold-l); }

        /* cat filter */
        .cat-row { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:20px; }
        .cp {
            padding:4px 13px; border:1px solid #1a1a1a;
            background:transparent; color:var(--muted);
            font-family:inherit; font-size:.7rem; letter-spacing:.06em; cursor:pointer;
            transition:all .15s;
        }
        .cp:hover { border-color:#2a2a2a; color:var(--text); }
        .cp.on { background:var(--gold-dim); border-color:var(--gold-bd); color:var(--gold); }

        /* ─── FORM ─── */
        #form-wrap {
            display:none; border:1px solid var(--gold-bd);
            background:var(--s1); padding:26px 30px;
            margin-bottom:24px; animation:slideIn .25s ease;
        }
        .fh { display:flex; justify-content:space-between; align-items:center;
              margin-bottom:18px; }
        .fh h2 { font-size:.62rem; font-weight:500; letter-spacing:.2em;
                 text-transform:uppercase; color:var(--gold); }
        .fh-close { background:none; border:none; color:var(--muted);
                    cursor:pointer; font-size:1.1rem; line-height:1; }
        .fh-close:hover { color:var(--text); }

        .co-row { display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap; }
        .co {
            padding:4px 12px; border:1px solid #1e1e1e;
            background:transparent; color:var(--muted);
            font-family:inherit; font-size:.7rem; cursor:pointer; transition:all .15s;
        }
        .co.on { background:var(--gold-dim); border-color:var(--gold-bd); color:var(--gold); }

        input[type=text],input[type=date],textarea {
            width:100%; padding:10px 13px; margin-bottom:9px;
            background:var(--bg); color:var(--text);
            border:1px solid #1c1c1c; font-size:.875rem;
            font-family:inherit; font-weight:300; outline:none;
            transition:border-color .2s; border-radius:0; -webkit-appearance:none;
        }
        input:focus,textarea:focus { border-color:var(--gold-bd); }
        input[type=date] { color-scheme:dark; }
        textarea { min-height:95px; resize:vertical; }

        .ff { display:flex; align-items:center; gap:10px; margin-top:4px; }
        .btn-save {
            padding:10px 22px; background:var(--gold); color:#000;
            border:none; font-family:inherit; font-size:.75rem; font-weight:600;
            letter-spacing:.12em; text-transform:uppercase; cursor:pointer;
            transition:background .2s;
        }
        .btn-save:hover { background:var(--gold-l); }
        .btn-cancel {
            padding:10px 18px; background:transparent; color:var(--muted);
            border:1px solid #222; font-family:inherit; font-size:.75rem;
            letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
            transition:all .2s;
        }
        .btn-cancel:hover { border-color:#333; color:var(--text); }
        #cc { font-size:.68rem; color:var(--muted); margin-left:auto; }

        /* ─── ENTRIES LIST ─── */
        .list-head {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:10px;
        }
        .list-lbl { font-size:.62rem; font-weight:500;
                    letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
        #exp-btn {
            padding:4px 12px; background:transparent;
            border:1px solid #1e1e1e; color:var(--muted);
            font-family:inherit; font-size:.65rem; letter-spacing:.08em; cursor:pointer;
            transition:all .15s;
        }
        #exp-btn:hover { border-color:#333; color:var(--text); }

        .day-tabs-wrap { overflow-x:auto; margin-bottom:16px;
            scrollbar-width:thin; scrollbar-color:#1e1e1e transparent; }
        .day-tabs { display:flex; gap:3px; min-width:max-content; }
        .dt {
            padding:6px 16px; border:1px solid #1a1a1a;
            background:transparent; color:var(--muted);
            font-family:inherit; font-size:.72rem; letter-spacing:.06em;
            cursor:pointer; transition:all .15s; white-space:nowrap;
        }
        .dt:hover { border-color:#2a2a2a; color:var(--text); }
        .dt.on { background:var(--gold-dim); border-color:var(--gold-bd); color:var(--gold); }
        .dt .dbc { display:inline-block; margin-left:5px; background:var(--gold); color:#000;
                   font-size:.58rem; font-weight:700; padding:1px 5px;
                   border-radius:99px; vertical-align:middle; }
        .dt:not(.on) .dbc { background:#1e1e1e; color:var(--muted); }

        .entry {
            background:var(--s1); border:1px solid #141414;
            border-left:2px solid var(--gold);
            padding:18px 22px; margin-bottom:5px;
            transition:border-color .2s; animation:slideIn .3s ease;
        }
        .entry:hover { border-color:var(--gold-bd); border-left-color:var(--gold); }
        .et { display:flex; align-items:flex-start; justify-content:space-between;
              gap:10px; margin-bottom:3px; }
        .entry h3 { font-size:.95rem; font-weight:500; }
        .ecat {
            font-size:.58rem; font-weight:500; letter-spacing:.08em;
            text-transform:uppercase; padding:2px 7px;
            border:1px solid var(--gold-bd); color:var(--gold); flex-shrink:0;
        }
        .edate { color:var(--muted); font-size:.7rem; margin-bottom:9px; }
        .ebody { font-size:.875rem; font-weight:300; color:#888; line-height:1.75; }
        .ea { margin-top:12px; display:flex; gap:6px; }
        .ea button {
            padding:4px 12px; background:transparent;
            font-family:inherit; font-size:.65rem; letter-spacing:.08em;
            text-transform:uppercase; cursor:pointer; transition:all .15s;
            border-radius:0;
        }
        .eb { border:1px solid var(--gold-bd); color:var(--gold); }
        .eb:hover { background:var(--gold-dim); }
        .ed { border:1px solid #1e1e1e; color:#4a4a4a; }
        .ed:hover { border-color:#8b2e2e; color:#c0392b; }

        .empty { text-align:center; color:var(--muted); padding:50px 0;
                 font-size:.82rem; letter-spacing:.06em; }

        /* ─── FOOTER ─── */
        footer {
            margin-top:70px; padding:28px 0;
            border-top:1px solid #141414;
            text-align:center;
            font-size:.62rem; letter-spacing:.25em;
            text-transform:uppercase; color:#2a2a2a;
            font-weight:400;
        }
        footer span { color:var(--gold); opacity:.5; }

        /* toast */
        #toast {
            position:fixed; bottom:30px; right:30px;
            background:var(--gold); color:#000;
            padding:9px 18px; font-size:.75rem; font-weight:600;
            letter-spacing:.08em; opacity:0; transform:translateY(8px);
            transition:all .3s; pointer-events:none; z-index:999;
        }
        #toast.on { opacity:1; transform:translateY(0); }

        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-thumb { background:#1e1e1e; }
    </style>
</head>
<body>

<!-- ══════════════════ INTRO ══════════════════ -->
<div id="intro">
    <div class="particle" style="width:4px;height:4px;left:18%;bottom:8%;animation-delay:0s;animation-duration:3s"></div>
    <div class="particle" style="width:3px;height:3px;left:32%;bottom:5%;animation-delay:.6s;animation-duration:3.4s"></div>
    <div class="particle" style="width:5px;height:5px;left:52%;bottom:7%;animation-delay:1.1s;animation-duration:2.8s"></div>
    <div class="particle" style="width:3px;height:3px;left:68%;bottom:11%;animation-delay:.3s;animation-duration:3.7s"></div>
    <div class="particle" style="width:4px;height:4px;left:79%;bottom:6%;animation-delay:1.6s;animation-duration:3.1s"></div>
    <div class="particle" style="width:3px;height:3px;left:9%;bottom:14%;animation-delay:.9s;animation-duration:3.3s"></div>
    <div class="particle" style="width:6px;height:6px;left:44%;bottom:3%;animation-delay:1.3s;animation-duration:2.9s"></div>
    <div class="particle" style="width:3px;height:3px;left:87%;bottom:9%;animation-delay:.2s;animation-duration:3.5s"></div>
    <div class="particle" style="width:4px;height:4px;left:60%;bottom:15%;animation-delay:2s;animation-duration:2.7s"></div>
    <div class="particle" style="width:3px;height:3px;left:25%;bottom:18%;animation-delay:.4s;animation-duration:3.8s"></div>

    <div id="intro-label">Ваш номер сегодня</div>
    <div id="rw"><canvas id="rc" width="280" height="280"></canvas></div>
    <div id="rn">67</div>
    <div id="rl">Личный номер удачи — только ваш</div>
    <button id="skip" onclick="exitIntro()">Войти →</button>
</div>

<!-- ══════════════════ DANCER ══════════════════ -->
<div class="dancer" id="dancer" onclick="dancerFall()" title="Кликни на меня!">
    <svg class="pa" viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="7" r="5.5" fill="none" stroke="#C9A84C" stroke-width="2"/>
        <line x1="20" y1="12.5" x2="20" y2="33" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="20" y1="19" x2="5"  y2="11" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="19" x2="35" y2="27" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="33" x2="10" y2="52" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="20" y1="33" x2="30" y2="50" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="10" y1="52" x2="3"  y2="50" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <line x1="30" y1="50" x2="37" y2="52" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <svg class="pb" viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="7" r="5.5" fill="none" stroke="#C9A84C" stroke-width="2"/>
        <line x1="20" y1="12.5" x2="20" y2="33" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="20" y1="19" x2="5"  y2="27" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="19" x2="35" y2="11" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="33" x2="8"  y2="50" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="20" y1="33" x2="26" y2="54" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="8"  y1="50" x2="1"  y2="48" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <line x1="26" y1="54" x2="33" y2="54" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="dancer-tag">67</div>
</div>

<!-- ══════════════════ APP ══════════════════ -->
<div id="app">
<div class="wrap">

    <header>
        <div class="hdeco"><h1>Мои Заметки</h1></div>
        <p class="hsub">Граф знаний · всё связано</p>
        <div class="lvl-badge">
            <span id="lvlName">Новичок</span>
            <div class="xp-track"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
            <span class="xp-txt" id="xpTxt">0 / 5</span>
        </div>
    </header>

    <div class="stats">
        <div class="sc"><span class="sn" id="tc">0</span><span class="sl">Заметок</span></div>
        <div class="sc"><span class="sn" id="tdc">0</span><span class="sl">Сегодня</span></div>
        <div class="sc"><span class="sn" id="sc2">0</span><span class="sl">дней подряд</span></div>
    </div>

    <!-- GRAPH -->
    <div class="graph-section">
        <div class="graph-toolbar">
            <span>Граф заметок</span>
            <span class="graph-hint">Перетаскивай · клик = детали</span>
        </div>
        <canvas id="gc"></canvas>
        <div id="g-detail">
            <div class="dc" id="gd-cat"></div>
            <h3 id="gd-title"></h3>
            <div class="dd" id="gd-date"></div>
            <div class="db" id="gd-body"></div>
            <div class="da">
                <button class="g-edit-btn" onclick="editFromGraph()">Редактировать</button>
                <button class="g-close-btn" onclick="closeDetail()">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="ctrl-row">
        <div class="search-wrap">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" id="si" placeholder="Поиск по заметкам..." oninput="renderList()">
        </div>
        <button id="add-btn" onclick="toggleForm()">+ Заметка</button>
    </div>

    <div class="cat-row">
        <button class="cp on" data-c="all"     onclick="setCat(this,'all')">Все</button>
        <button class="cp"    data-c="Учёба"   onclick="setCat(this,'Учёба')">📚 Учёба</button>

<script>
// ════════════════════════════════════════
// ROULETTE  (7 s spin)
// ════════════════════════════════════════
(function(){
    const canvas = document.getElementById('rc');
    const ctx    = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2;
    const OR = W/2 - 7, IR = OR * 0.2;

    const nums = [67,0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,3,26,7,29,18,22,9,31,14,16];
    const N = nums.length;
    const seg = (2*Math.PI) / N;

    function col(n,i){
        if(n===67) return '#C9A84C';
        if(n===0)  return '#183a18';
        return i%2===0 ? '#1e0000' : '#0a0a0a';
    }

    function draw(angle){
        ctx.clearRect(0,0,W,H);
        ctx.beginPath(); ctx.arc(cx,cy,OR+5,0,2*Math.PI);
        ctx.fillStyle='#1a1205'; ctx.fill();

        for(let i=0;i<N;i++){
            const a1=angle+i*seg, a2=a1+seg;
            ctx.beginPath(); ctx.moveTo(cx,cy);
            ctx.arc(cx,cy,OR,a1,a2); ctx.closePath();
            ctx.fillStyle=col(nums[i],i); ctx.fill();
            ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.stroke();

            ctx.save();
            ctx.translate(cx,cy); ctx.rotate(a1+seg/2);
            ctx.textAlign='right';
            ctx.fillStyle = nums[i]===67 ? '#000' : '#ccc';
            ctx.font = (nums[i]===67?'bold ':'')+'10px Inter';
            ctx.fillText(nums[i], OR-7, 4);
            ctx.restore();
        }

        // hub
        ctx.beginPath(); ctx.arc(cx,cy,IR,0,2*Math.PI);
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,IR);
        g.addColorStop(0,'#1a1205'); g.addColorStop(1,'#0d0900');
        ctx.fillStyle=g; ctx.fill();
        ctx.strokeStyle='#C9A84C'; ctx.lineWidth=2; ctx.stroke();

        // rim dots
        for(let i=0;i<N;i++){
            const a=angle+i*seg;
            ctx.beginPath();
            ctx.arc(cx+Math.cos(a)*OR, cy+Math.sin(a)*OR, 2.5, 0, 2*Math.PI);
            ctx.fillStyle='#C9A84C'; ctx.fill();
        }
    }

    // 67 at index 0 → land it at pointer (top = -π/2)
    // angle + seg/2 = -π/2  →  angle = -π/2 - seg/2
    const finalAngle = -Math.PI/2 - seg/2;
    const spinTotal  = finalAngle + 11 * 2*Math.PI; // 11 full rotations
    const dur = 7200; // ms
    let t0 = null;

    function ease(x){ return 1 - Math.pow(1-x, 4.5); }

    function frame(ts){
        if(!t0) t0=ts;
        const p = Math.min((ts-t0)/dur, 1);
        draw(spinTotal * ease(p));
        if(p<1){ requestAnimationFrame(frame); }
        else { draw(finalAngle); onDone(); }
    }
    requestAnimationFrame(frame);

    window.onDone = function(){
        document.getElementById('rn').classList.add('on');
        document.getElementById('rl').classList.add('on');
        document.getElementById('skip').classList.add('on');
        setTimeout(exitIntro, 3500);
    };
})();

function exitIntro(){
    const i=document.getElementById('intro');
    i.classList.add('bye');
    setTimeout(()=>{ i.style.display='none'; document.getElementById('app').classList.add('on'); initGraph(); },800);
}

// ════════════════════════════════════════
// DATA
// ════════════════════════════════════════
const SK = 'mjnotes-v2';
let editId=null, activeDay='all', activeCat='all', selCo='Учёба', selNode=null;

const SAMPLES = [
    {id:'s1',date:'2026-06-15',category:'Проект', title:'Telegram-бот с ИИ',     text:'Python + aiogram. API: Groq, OpenRouter, Together, HuggingFace, Cerebras. Fallback в тестовый режим. Задеплоил на bothost.ru.'},
    {id:'s2',date:'2026-06-15',category:'Победа', title:'Стиль бота под Мелстроя', text:'Системный промпт, few-shot примеры. Слова: беды, друн, баба, нормалды, масса, щавель, хаммам.'},
    {id:'s3',date:'2026-06-15',category:'Учёба',  title:'Сайт с планом обучения', text:'HTML-сайт с 2-недельным планом по AI-ботам, полезными ссылками и инструкциями.'},
    {id:'s4',date:'2026-06-14',category:'Идея',   title:'Идея: бот-переводчик', text:'Сделать бота который переводит сообщения голосом туда и обратно в реальном времени.'},
    {id:'s5',date:'2026-06-14',category:'Учёба',  title:'Изучил основы asyncio', text:'Event loop, корутины, await/async, gather. Теперь понимаю как работает aiogram под капотом.'},
];

const LEVELS=[{n:'Новичок',min:0},{n:'Практик',min:5},{n:'Мастер',min:15},{n:'Эксперт',min:30}];
const CAT_CLR={'Учёба':'#5B9BD5','Проект':'#70C070','Победа':'#C9A84C','Идея':'#B87AE8','Другое':'#888'};

function get(){ const d=localStorage.getItem(SK); if(d) return JSON.parse(d); localStorage.setItem(SK,JSON.stringify(SAMPLES)); return SAMPLES; }
function save(e){ localStorage.setItem(SK,JSON.stringify(e)); }
function gid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function fmt(s){ return new Date(s).toLocaleDateString('ru-RU',{year:'numeric',month:'long',day:'numeric'}); }
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

// ════════════════════════════════════════
// GRAPH  (force-directed + spider web)
// ════════════════════════════════════════
let gNodes=[], gEdges=[], rafId=null;
let hovNode=null, dragN=null, dragMoved=false, mouseX=0, mouseY=0;

function initGraph(){
    const gc=document.getElementById('gc');
    const W=gc.parentElement.clientWidth;
    const H=Math.max(380, Math.round(W*0.52));
    gc.width=W; gc.height=H;
    buildGraph(W,H);
    bindGraphEvents(gc);
    if(rafId) cancelAnimationFrame(rafId);
    tick(gc,W/2,H/2);
}

function buildGraph(W,H){
    const entries=get();
    gNodes=[]; gEdges=[];
    const cx=W/2, cy=H/2;

    // category hubs
    const cats=[...new Set(entries.map(e=>e.category||'Другое'))];
    cats.forEach((cat,i)=>{
        const a=(i/cats.length)*2*Math.PI - Math.PI/2;
        gNodes.push({id:'h-'+cat,label:cat,cat,isHub:true,
            x:cx+Math.cos(a)*90, y:cy+Math.sin(a)*90,
            vx:0,vy:0, r:14});
    });

    // entry nodes
    entries.forEach((e,i)=>{
        const a=(i/entries.length)*2*Math.PI;
        const d=170+(Math.random()-.5)*60;
        gNodes.push({id:e.id,label:e.title,cat:e.category||'Другое',
            date:e.date,text:e.text,isHub:false,
            x:cx+Math.cos(a)*d, y:cy+Math.sin(a)*d,
            vx:(Math.random()-.5)*1.5, vy:(Math.random()-.5)*1.5,
            r:8});
        gEdges.push({s:e.id,t:'h-'+(e.category||'Другое'),k:.07,len:120});
    });

    // same-day links
    for(let i=0;i<entries.length;i++)
        for(let j=i+1;j<entries.length;j++)
            if(entries[i].date===entries[j].date)
                gEdges.push({s:entries[i].id,t:entries[j].id,k:.015,len:150,day:true});
}

function physicsStep(cx,cy,W,H){
    const n=gNodes;
    // repulsion
    for(let i=0;i<n.length;i++) for(let j=i+1;j<n.length;j++){
        const dx=n[j].x-n[i].x, dy=n[j].y-n[i].y;
        const d2=dx*dx+dy*dy||.01, d=Math.sqrt(d2);
        const f=2800/d2;
        const fx=(dx/d)*f*.05, fy=(dy/d)*f*.05;
        n[i].vx-=fx; n[i].vy-=fy;
        n[j].vx+=fx; n[j].vy+=fy;
    }
    // springs
    for(const e of gEdges){
        const s=n.find(x=>x.id===e.s), t=n.find(x=>x.id===e.t);
        if(!s||!t) continue;
        const dx=t.x-s.x, dy=t.y-s.y;
        const d=Math.sqrt(dx*dx+dy*dy)||1;
        const str=e.k*(d-e.len);
        const fx=(dx/d)*str, fy=(dy/d)*str;
        s.vx+=fx; s.vy+=fy; t.vx-=fx; t.vy-=fy;
    }
    // update
    for(const node of n){
        if(node===dragN) continue;
        node.vx+=(cx-node.x)*.002; node.vy+=(cy-node.y)*.002;
        node.vx*=.86; node.vy*=.86;
        node.x+=node.vx; node.y+=node.vy;
        node.x=Math.max(node.r+4, Math.min(W-node.r-4, node.x));
        node.y=Math.max(node.r+4, Math.min(H-node.r-4, node.y));
    }
}

function drawGraph(gc,cx,cy){
    const ctx=gc.getContext('2d');
    const W=gc.width, H=gc.height;
    ctx.clearRect(0,0,W,H);

    // bg
    ctx.fillStyle='#080808'; ctx.fillRect(0,0,W,H);

    // faint web rings (decorative)
    for(let r=60;r<Math.max(W,H);r+=80){
        ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
        ctx.strokeStyle='rgba(201,168,76,0.025)'; ctx.lineWidth=1; ctx.stroke();
    }
    for(let a=0;a<12;a++){
        const ang=a*(Math.PI/6);
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(ang)*Math.max(W,H), cy+Math.sin(ang)*Math.max(W,H));
        ctx.strokeStyle='rgba(201,168,76,0.018)'; ctx.lineWidth=1; ctx.stroke();
    }

    // edges
    for(const e of gEdges){
        const s=gNodes.find(n=>n.id===e.s), t=gNodes.find(n=>n.id===e.t);
        if(!s||!t) continue;
        const hi = selNode && (selNode.id===s.id||selNode.id===t.id);
        ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
        ctx.strokeStyle = hi ? 'rgba(201,168,76,.55)' : e.day ? 'rgba(201,168,76,.07)' : 'rgba(201,168,76,.13)';
        ctx.lineWidth = hi ? 1.5 : 0.8;
        ctx.setLineDash(e.day ? [3,4] : []);
        ctx.stroke(); ctx.setLineDash([]);
    }

    // nodes
    for(const node of gNodes){
        const clr = CAT_CLR[node.cat]||'#888';
        const isSel = selNode&&selNode.id===node.id;
        const isHov = hovNode&&hovNode.id===node.id;

        // glow
        if(isSel||isHov){
            ctx.shadowColor=clr; ctx.shadowBlur=isSel?22:14;
        }

        ctx.beginPath(); ctx.arc(node.x,node.y,node.r,0,2*Math.PI);
        ctx.fillStyle = node.isHub ? '#0d0d0d' : clr+'30';
        ctx.fill();
        ctx.strokeStyle = (isSel||isHov) ? clr : clr+'60';
        ctx.lineWidth = node.isHub ? 2 : 1.5;
        ctx.stroke();
        ctx.shadowBlur=0;

        // hub label always, entry label on hover/select
        if(node.isHub||(isHov||isSel)){
            const lbl = node.label.length>22 ? node.label.slice(0,22)+'…' : node.label;
            ctx.fillStyle = node.isHub ? clr : '#e8e4df';
            ctx.font = node.isHub ? '500 10px Inter' : '400 10px Inter';
            ctx.textAlign='center';
            ctx.fillText(lbl, node.x, node.y+node.r+(node.isHub?14:13));
        }

        // dot for entry nodes
        if(!node.isHub){
            ctx.beginPath(); ctx.arc(node.x,node.y,2.5,0,2*Math.PI);
            ctx.fillStyle = (isSel||isHov) ? clr : clr+'80';
            ctx.fill();
        }
    }
}

function tick(gc,cx,cy){
    physicsStep(cx,cy,gc.width,gc.height);
    drawGraph(gc,cx,cy);
    rafId=requestAnimationFrame(()=>tick(gc,cx,cy));
}

function nodeAt(gc,ex,ey){
    const r=gc.getBoundingClientRect();
    const mx=ex-r.left, my=ey-r.top;
    return gNodes.find(n=>{ const dx=n.x-mx,dy=n.y-my; return Math.sqrt(dx*dx+dy*dy)<n.r+4; })||null;
}

function bindGraphEvents(gc){
    let downX=0,downY=0;

    gc.addEventListener('mousedown',e=>{
        const nd=nodeAt(gc,e.clientX,e.clientY);
        if(nd){ dragN=nd; downX=e.clientX; downY=e.clientY; dragMoved=false; e.preventDefault(); }
    });
    gc.addEventListener('mousemove',e=>{
        if(dragN){
            const r=gc.getBoundingClientRect();
            dragN.x=e.clientX-r.left; dragN.y=e.clientY-r.top;
            dragN.vx=0; dragN.vy=0;
            if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>4) dragMoved=true;
        } else {
            hovNode=nodeAt(gc,e.clientX,e.clientY);
            gc.style.cursor=hovNode?'pointer':'default';
        }
    });
    gc.addEventListener('mouseup',e=>{
        if(dragN&&!dragMoved){
            if(!dragN.isHub){
                selNode=selNode&&selNode.id===dragN.id?null:dragN;
                selNode ? showDetail(selNode) : closeDetail();
            } else { selNode=null; closeDetail(); }
        }
        dragN=null; dragMoved=false;
    });
    gc.addEventListener('mouseleave',()=>{ if(!dragN) hovNode=null; });

    // touch support
    gc.addEventListener('touchstart',e=>{
        const t=e.touches[0];
        const nd=nodeAt(gc,t.clientX,t.clientY);
        if(nd){ dragN=nd; downX=t.clientX; downY=t.clientY; dragMoved=false; e.preventDefault(); }
    },{passive:false});
    gc.addEventListener('touchmove',e=>{
        if(!dragN) return;
        const t=e.touches[0], r=gc.getBoundingClientRect();
        dragN.x=t.clientX-r.left; dragN.y=t.clientY-r.top; dragN.vx=0; dragN.vy=0;
        if(Math.abs(t.clientX-downX)+Math.abs(t.clientY-downY)>4) dragMoved=true;
        e.preventDefault();
    },{passive:false});
    gc.addEventListener('touchend',()=>{
        if(dragN&&!dragMoved&&!dragN.isHub){
            selNode=selNode&&selNode.id===dragN.id?null:dragN;
            selNode ? showDetail(selNode) : closeDetail();
        }
        dragN=null; dragMoved=false;
    });
}

function showDetail(node){
    document.getElementById('gd-cat').textContent   = node.cat||'';
    document.getElementById('gd-title').textContent = node.label;
    document.getElementById('gd-date').textContent  = node.date ? fmt(node.date) : '';
    document.getElementById('gd-body').innerHTML    = esc(node.text||'').replace(/\n/g,'<br>');
    document.getElementById('g-detail').style.display='block';
}
function closeDetail(){
    selNode=null;
    document.getElementById('g-detail').style.display='none';
}
function editFromGraph(){
    if(!selNode) return;
    editEntry(selNode.id);
    closeDetail();
}

window.addEventListener('resize',()=>{ if(document.getElementById('app').classList.contains('on')) initGraph(); });

// ════════════════════════════════════════
let formOpen=false;
function toggleForm(){
    formOpen=!formOpen;
    document.getElementById('form-wrap').style.display=formOpen?'block':'none';
    if(formOpen) document.getElementById('et').focus();
}
function pickCo(btn){ document.querySelectorAll('.co').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); selCo=btn.dataset.v; }
function upCC(){ document.getElementById('cc').textContent=document.getElementById('eb').value.length+' симв.'; }

function saveEntry(){
    const date=document.getElementById('ed').value;
    const title=document.getElementById('et').value.trim();
    const text=document.getElementById('eb').value.trim();
    if(!date||!title||!text){ toast('Заполни все поля'); return; }
    let entries=get();
    if(editId){
        const i=entries.findIndex(e=>e.id===editId);
        if(i!==-1) entries[i]={id:editId,date,category:selCo,title,text};
        editId=null;
    } else {
        entries.push({id:gid(),date,category:selCo,title,text});
    }
    save(entries);
    clearForm(); renderList(); buildGraph(document.getElementById('gc').width,document.getElementById('gc').height);
    toast('Сохранено');
}

function deleteEntry(id){
    if(!confirm('Удалить заметку?')) return;
    save(get().filter(e=>e.id!==id));
    renderList(); buildGraph(document.getElementById('gc').width,document.getElementById('gc').height);
    toast('Удалено');
}

function editEntry(id){
    const e=get().find(x=>x.id===id); if(!e) return;
    document.getElementById('ed').value=e.date;
    document.getElementById('et').value=e.title;
    document.getElementById('eb').value=e.text; upCC();
    document.querySelectorAll('.co').forEach(b=>b.classList.toggle('on',b.dataset.v===(e.category||'Другое')));
    selCo=e.category||'Другое';
    document.getElementById('ftitle').textContent='Редактировать';
    document.getElementById('sbtn').textContent='Обновить';
    document.getElementById('cbtn').style.display='inline-block';
    editId=id;
    if(!formOpen) toggleForm();
    window.scrollTo({top:0,behavior:'smooth'});
}

function cancelEdit(){ clearForm(); }
function clearForm(){
    document.getElementById('ed').value=new Date().toISOString().split('T')[0];
    document.getElementById('et').value='';
    document.getElementById('eb').value=''; upCC();
    document.getElementById('ftitle').textContent='Новая заметка';
    document.getElementById('sbtn').textContent='Сохранить';
    document.getElementById('cbtn').style.display='none';
    editId=null;
    document.querySelectorAll('.co').forEach((b,i)=>b.classList.toggle('on',i===0));
    selCo='Учёба';
}

// LIST RENDER

function setCat(btn,c){
    document.querySelectorAll('.cp').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); activeCat=c; renderList();
}

// fix typo in inline onclick
window.setCат = setCat;

function setDay(btn,d){
    activeDay=d;
    document.querySelectorAll('.dt').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    renderList();
}

function renderDayTabs(){
    const entries=get();
    const dates=[...new Set(entries.map(e=>e.date))].sort().reverse();
    let h=`<button class="dt ${activeDay==='all'?'on':''}" onclick="setDay(this,'all')">Все<span class="dbc">${entries.length}</span></button>`;
    dates.forEach(d=>{
        const cnt=entries.filter(e=>e.date===d).length;
        const lbl=new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
        h+=`<button class="dt ${activeDay===d?'on':''}" onclick="setDay(this,'${d}')">${lbl}<span class="dbc">${cnt}</span></button>`;
    });
    document.getElementById('dtabs').innerHTML=h;
}

function renderList(){
    renderDayTabs();
    const q=document.getElementById('si').value.toLowerCase();
    let entries=get().sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(activeDay!=='all') entries=entries.filter(e=>e.date===activeDay);
    if(activeCat!=='all') entries=entries.filter(e=>(e.category||'Другое')===activeCat);
    if(q) entries=entries.filter(e=>e.title.toLowerCase().includes(q)||e.text.toLowerCase().includes(q));

    const el=document.getElementById('list');
    el.innerHTML = entries.length===0
        ? '<div class="empty">Ничего не найдено.</div>'
        : entries.map(e=>`
            <div class="entry" id="entry-${e.id}">
                <div class="et"><h3>${esc(e.title)}</h3><span class="ecat">${esc(e.category||'Другое')}</span></div>
                <div class="edate">${fmt(e.date)}</div>
                <div class="ebody">${esc(e.text).replace(/\n/g,'<br>')}</div>
                <div class="ea">
                    <button class="eb" onclick="editEntry('${e.id}')">Ред.</button>
                    <button class="ed" onclick="deleteEntry('${e.id}')">Удалить</button>
                </div>
            </div>`).join('');
    updateStats();
}

function updateStats(){
    const entries=get();
    const today=new Date().toISOString().split('T')[0];
    const dates=[...new Set(entries.map(e=>e.date))].sort();
    let streak=0;
    if(dates.length>0){
        const c=new Date();
        if(dates.includes(today)){
            streak=1;
            while(true){ c.setDate(c.getDate()-1); const ds=c.toISOString().split('T')[0]; if(dates.includes(ds)) streak++; else break; }
        }
    }
    document.getElementById('tc').textContent=entries.length;
    document.getElementById('tdc').textContent=entries.filter(e=>e.date===today).length;
    document.getElementById('sc2').textContent=streak;

    // level
    const n=entries.length;
    let lv=LEVELS[0];
    for(const l of LEVELS) if(n>=l.min) lv=l;
    const nx=LEVELS.find(l=>l.min>n);
    const pct=nx?Math.round(((n-lv.min)/(nx.min-lv.min))*100):100;
    document.getElementById('lvlName').textContent=lv.n;
    document.getElementById('xpFill').style.width=pct+'%';
    document.getElementById('xpTxt').textContent=nx?`${n} / ${nx.min}`:`${n} макс.`;
}

function exportAll(){
    const t=get().sort((a,b)=>new Date(b.date)-new Date(a.date))
        .map(e=>`[${e.date}] [${e.category||''}] ${e.title}\n${e.text}`).join('\n\n---\n\n');
    navigator.clipboard.writeText(t).then(()=>toast('Скопировано'));
}

function toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('on');
    setTimeout(()=>t.classList.remove('on'),2400);
}

// ── INIT ──
document.getElementById('ed').value=new Date().toISOString().split('T')[0];
renderList();
</script>
</body>
