<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой прогресс</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #C9A84C;
            --gold-light: #E2C47A;
            --gold-dim: rgba(201, 168, 76, 0.15);
            --gold-border: rgba(201, 168, 76, 0.3);
            --bg: #0A0A0A;
            --surface: #111111;
            --surface2: #181818;
            --text: #F0EDE8;
            --text-muted: #6B6560;
            --danger: #8B2E2E;
            --danger-hover: #A63535;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 56px;
        }

        .logo-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .logo-line::before,
        .logo-line::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold-border));
        }

        .logo-line::after {
            background: linear-gradient(to left, transparent, var(--gold-border));
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gold);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            font-weight: 300;
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--gold-border);
            border: 1px solid var(--gold-border);
            margin-bottom: 40px;
        }

        .stats > div {
            background: var(--surface);
            padding: 24px 16px;
            text-align: center;
        }

        .stats .number {
            font-size: 2rem;
            font-weight: 300;
            color: var(--gold);
            display: block;
            line-height: 1;
            margin-bottom: 6px;
        }

        .stats .label {
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* FORM */
        .form-section {
            border: 1px solid var(--gold-border);
            background: var(--surface);
            padding: 32px;
            margin-bottom: 40px;
        }

        .form-section h2 {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 24px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid #222;
            font-size: 0.9rem;
            font-family: inherit;
            font-weight: 300;
            outline: none;
            transition: border-color 0.2s;
            border-radius: 0;
            -webkit-appearance: none;
        }

        input:focus, textarea:focus {
            border-color: var(--gold-border);
        }

        input[type="date"] {
            color-scheme: dark;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        button {
            padding: 11px 24px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: background 0.2s, color 0.2s;
        }

        .btn-primary {
            background: var(--gold);
            color: #0A0A0A;
        }

        .btn-primary:hover {
            background: var(--gold-light);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #2a2a2a;
        }

        .btn-secondary:hover {
            border-color: #444;
            color: var(--text);
        }

        /* ENTRIES */
        .section-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .entry {
            background: var(--surface);
            border: 1px solid #1a1a1a;
            border-left: 2px solid var(--gold);
            padding: 24px 28px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }

        .entry:hover {
            border-color: var(--gold-border);
            border-left-color: var(--gold);
        }

        .entry h3 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 4px;
        }

        .entry .date {
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .entry .body {
            font-size: 0.9rem;
            font-weight: 300;
            color: #999;
            line-height: 1.7;
        }

        .entry .actions {
            margin-top: 16px;
            display: flex;
            gap: 8px;
        }

        .entry .actions button {
            padding: 6px 14px;
            font-size: 0.7rem;
        }

        .edit-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold-border);
        }

        .edit-btn:hover {
            background: var(--gold-dim);
        }

        .delete-btn {
            background: transparent;
            color: #666;
            border: 1px solid #222;
        }

        .delete-btn:hover {
            color: #cc5555;
            border-color: #8B2E2E;
        }

        .empty {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 0;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-line">
                <h1>Мой прогресс</h1>
            </div>
            <p>Трекер того, что я сделал и чему научился</p>
        </header>

        <div class="stats">
            <div>
                <span class="number" id="totalCount">0</span>
                <span class="label">записей</span>
            </div>
            <div>
                <span class="number" id="todayCount">0</span>
                <span class="label">сегодня</span>
            </div>
            <div>
                <span class="number" id="streakCount">0</span>
                <span class="label">дней подряд</span>
            </div>
        </div>

        <div class="form-section">
            <h2 id="formTitle">Добавить запись</h2>
            <input type="date" id="entryDate">
            <input type="text" id="entryTitle" placeholder="Заголовок — например: Сделал Telegram бота">
            <textarea id="entryText" placeholder="Что сделал, что узнал, какие проблемы решил..."></textarea>
            <div class="btn-row">
                <button class="btn-primary" onclick="saveEntry()" id="saveBtn">Сохранить</button>
                <button class="btn-secondary" onclick="cancelEdit()" id="cancelBtn" style="display:none;">Отмена</button>
            </div>
        </div>

        <div class="section-label" id="entriesLabel" style="display:none;">Записи</div>
        <div id="entriesList"></div>
    </div>

    <script>
        const STORAGE_KEY = 'my-progress-entries';
        let editingId = null;

        const SAMPLE_ENTRIES = [
            {
                id: 'sample-1',
                date: '2026-06-15',
                title: 'Создал Telegram-бота с ИИ',
                text: 'Сделал бота на Python + aiogram. Подключил несколько API: Groq, OpenRouter, Together, HuggingFace, Cerebras. Сделал fallback в тестовый режим. Запушил на GitHub и задеплоил на bothost.ru.'
            },
            {
                id: 'sample-2',
                date: '2026-06-15',
                title: 'Настроил стиль бота под Мелстроя',
                text: 'Добавил системный промпт, few-shot примеры с мемными фразами, случайные вставки в начале ответа. Бот теперь использует слова: беды, друн, баба, нормалды, масса, щавель, хаммам.'
            },
            {
                id: 'sample-3',
                date: '2026-06-15',
                title: 'Сделал сайт с планом обучения',
                text: 'Создал HTML-сайт с 2-недельным планом по изучению AI-ботов, полезными ссылками и инструкциями.'
            }
        ];

        function getEntries() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) return JSON.parse(data);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(SAMPLE_ENTRIES));
            return SAMPLE_ENTRIES;
        }

        function saveEntries(entries) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('ru-RU', options);
        }

        function saveEntry() {
            const date = document.getElementById('entryDate').value;
            const title = document.getElementById('entryTitle').value.trim();
            const text = document.getElementById('entryText').value.trim();

            if (!date || !title || !text) {
                alert('Заполни все поля');
                return;
            }

            let entries = getEntries();

            if (editingId) {
                const index = entries.findIndex(e => e.id === editingId);
                if (index !== -1) entries[index] = { id: editingId, date, title, text };
                editingId = null;
            } else {
                entries.push({ id: generateId(), date, title, text });
            }

            saveEntries(entries);
            clearForm();
            renderEntries();
        }

        function deleteEntry(id) {
            if (!confirm('Удалить запись?')) return;
            saveEntries(getEntries().filter(e => e.id !== id));
            renderEntries();
        }

        function editEntry(id) {
            const entry = getEntries().find(e => e.id === id);
            if (!entry) return;
            document.getElementById('entryDate').value = entry.date;
            document.getElementById('entryTitle').value = entry.title;
            document.getElementById('entryText').value = entry.text;
            document.getElementById('formTitle').textContent = 'Редактировать запись';
            document.getElementById('saveBtn').textContent = 'Обновить';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            editingId = id;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() { clearForm(); }

        function clearForm() {
            document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('entryTitle').value = '';
            document.getElementById('entryText').value = '';
            document.getElementById('formTitle').textContent = 'Добавить запись';
            document.getElementById('saveBtn').textContent = 'Сохранить';
            document.getElementById('cancelBtn').style.display = 'none';
            editingId = null;
        }

        function renderEntries() {
            const entries = getEntries().sort((a, b) => new Date(b.date) - new Date(a.date));
            const container = document.getElementById('entriesList');
            const label = document.getElementById('entriesLabel');

            if (entries.length === 0) {
                label.style.display = 'none';
                container.innerHTML = '<div class="empty">Пока нет записей. Добавь первую.</div>';
            } else {
                label.style.display = 'block';
                container.innerHTML = entries.map(entry => `
                    <div class="entry">
                        <h3>${escapeHtml(entry.title)}</h3>
                        <div class="date">${formatDate(entry.date)}</div>
                        <div class="body">${escapeHtml(entry.text).replace(/\n/g, '<br>')}</div>
                        <div class="actions">
                            <button class="edit-btn" onclick="editEntry('${entry.id}')">Редактировать</button>
                            <button class="delete-btn" onclick="deleteEntry('${entry.id}')">Удалить</button>
                        </div>
                    </div>
                `).join('');
            }

            updateStats();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStats() {
            const entries = getEntries();
            const today = new Date().toISOString().split('T')[0];
            const todayCount = entries.filter(e => e.date === today).length;

            const dates = [...new Set(entries.map(e => e.date))].sort();
            let streak = 0;
            if (dates.length > 0) {
                const checkDate = new Date();
                if (dates.includes(checkDate.toISOString().split('T')[0])) {
                    streak = 1;
                    while (true) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        const dateStr = checkDate.toISOString().split('T')[0];
                        if (dates.includes(dateStr)) streak++;
                        else break;
                    }
                }
            }

            document.getElementById('totalCount').textContent = entries.length;
            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('streakCount').textContent = streak;
        }

        document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
        renderEntries();
    </script>
</body>
</html>
