<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой прогресс</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A84C;
            --gold-light: #E2C47A;
            --gold-dim: rgba(201,168,76,0.12);
            --gold-border: rgba(201,168,76,0.28);
            --bg: #080808;
            --surface: #0f0f0f;
            --surface2: #171717;
            --text: #F0EDE8;
            --text-muted: #5a5550;
            --red: #c0392b;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ───────── INTRO OVERLAY ───────── */
        #intro {
            position: fixed; inset: 0; z-index: 1000;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 24px;
        }

        #intro h2 {
            font-size: 0.7rem; letter-spacing: 0.25em;
            text-transform: uppercase; color: var(--text-muted);
            font-weight: 400;
        }

        /* particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0;
            animation: float-particle 3s ease-in-out infinite;
        }
        @keyframes float-particle {
            0%   { opacity:0; transform: translateY(0) scale(0.5); }
            30%  { opacity: 0.6; }
            100% { opacity:0; transform: translateY(-120px) scale(1); }
        }

        #roulette-wrap {
            position: relative;
            width: 260px; height: 260px;
        }

        /* pointer triangle */
        #roulette-wrap::before {
            content: '';
            position: absolute;
            top: -14px; left: 50%; transform: translateX(-50%);
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 16px solid var(--gold);
            z-index: 10;
            filter: drop-shadow(0 0 6px var(--gold));
        }

        #roulette-canvas {
            width: 260px; height: 260px;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(201,168,76,0.25), 0 0 80px rgba(201,168,76,0.1);
        }

        #reveal-number {
            font-size: 5rem; font-weight: 300;
            color: var(--gold);
            letter-spacing: 0.1em;
            text-shadow: 0 0 30px var(--gold), 0 0 60px rgba(201,168,76,0.5);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.4s, transform 0.4s;
        }
        #reveal-number.show {
            opacity: 1; transform: scale(1);
        }

        #reveal-label {
            font-size: 0.65rem; letter-spacing: 0.3em;
            text-transform: uppercase; color: var(--gold);
            opacity: 0; transition: opacity 0.4s 0.3s;
        }
        #reveal-label.show { opacity: 0.8; }

        #intro-skip {
            margin-top: 8px;
            padding: 10px 32px;
            background: transparent;
            border: 1px solid var(--gold-border);
            color: var(--gold);
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.4s 0.6s, background 0.2s;
        }
        #intro-skip.show { opacity: 1; }
        #intro-skip:hover { background: var(--gold-dim); }

        #intro.fade-out {
            animation: fadeOut 0.8s forwards;
        }
        @keyframes fadeOut {
            to { opacity:0; pointer-events:none; }
        }

        /* ───────── DANCER ───────── */
        .dancer-wrap {
            position: fixed;
            bottom: 20px; left: 20px;
            z-index: 900;
            cursor: default;
            user-select: none;
        }

        .dancer-wrap svg {
            width: 48px; height: 72px;
            overflow: visible;
        }

        /* pose A */
        .pose-a { display: block; }
        .pose-b { display: none; }

        .dancer-wrap:not(.alt) .pose-a { display: block; }
        .dancer-wrap:not(.alt) .pose-b { display: none; }
        .dancer-wrap.alt .pose-a { display: none; }
        .dancer-wrap.alt .pose-b { display: block; }

        .dancer-wrap {
            animation: dancer-bounce 0.42s steps(1) infinite;
        }
        @keyframes dancer-bounce {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }

        .dancer-label {
            text-align: center;
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            margin-top: 4px;
        }

        /* ───────── MAIN LAYOUT ───────── */
        #main-app {
            opacity: 0;
            transition: opacity 0.6s;
        }
        #main-app.visible { opacity: 1; }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 52px 24px 80px;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header-deco {
            display: flex; align-items: center; justify-content: center;
            gap: 20px; margin-bottom: 10px;
        }
        .header-deco::before, .header-deco::after {
            content: '';
            flex: 1; height: 1px;
            background: linear-gradient(to right, transparent, var(--gold-border));
        }
        .header-deco::after {
            background: linear-gradient(to left, transparent, var(--gold-border));
        }

        h1 {
            font-size: 1.55rem; font-weight: 300;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--gold);
        }

        .header-sub {
            color: var(--text-muted); font-size: 0.78rem;
            letter-spacing: 0.06em; font-weight: 300;
        }

        .level-badge {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 14px;
            border: 1px solid var(--gold-border);
            padding: 5px 14px;
            font-size: 0.7rem; letter-spacing: 0.1em;
            color: var(--gold);
            text-transform: uppercase;
        }

        .xp-bar-wrap {
            width: 120px; height: 3px;
            background: #222;
        }
        .xp-bar-fill {
            height: 100%;
            background: var(--gold);
            transition: width 0.6s ease;
        }

        /* STATS */
        .stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 1px; background: var(--gold-border);
            border: 1px solid var(--gold-border);
            margin-bottom: 32px;
        }
        .stat-cell {
            background: var(--surface);
            padding: 22px 12px; text-align: center;
        }
        .stat-number {
            display: block; font-size: 2rem; font-weight: 300;
            color: var(--gold); line-height: 1; margin-bottom: 5px;
        }
        .stat-label {
            color: var(--text-muted); font-size: 0.7rem;
            letter-spacing: 0.1em; text-transform: uppercase;
        }

        /* SEARCH */
        .search-wrap {
            position: relative; margin-bottom: 20px;
        }
        .search-wrap svg {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); pointer-events: none;
        }
        #searchInput {
            width: 100%; padding: 11px 16px 11px 42px;
            background: var(--surface); border: 1px solid #1e1e1e;
            color: var(--text); font-family: inherit; font-size: 0.875rem;
            font-weight: 300; outline: none;
            transition: border-color 0.2s;
        }
        #searchInput:focus { border-color: var(--gold-border); }
        #searchInput::placeholder { color: var(--text-muted); }

        /* CATEGORIES FILTER */
        .cat-filter {
            display: flex; gap: 6px; flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .cat-pill {
            padding: 5px 14px; border: 1px solid #1e1e1e;
            background: transparent; color: var(--text-muted);
            font-family: inherit; font-size: 0.72rem;
            letter-spacing: 0.06em; cursor: pointer;
            transition: all 0.15s;
        }
        .cat-pill:hover { border-color: #333; color: var(--text); }
        .cat-pill.active {
            background: var(--gold-dim); border-color: var(--gold-border);
            color: var(--gold);
        }

        /* DAY TABS */
        .day-tabs-wrap {
            margin-bottom: 28px; overflow-x: auto;
            scrollbar-width: thin; scrollbar-color: #222 transparent;
        }
        .day-tabs {
            display: flex; gap: 4px; min-width: max-content;
        }
        .day-tab {
            padding: 8px 18px; border: 1px solid #1e1e1e;
            background: transparent; color: var(--text-muted);
            font-family: inherit; font-size: 0.75rem;
            letter-spacing: 0.06em; cursor: pointer;
            transition: all 0.15s; white-space: nowrap;
            position: relative;
        }
        .day-tab:hover { border-color: #333; color: var(--text); }
        .day-tab.active {
            background: var(--gold-dim); border-color: var(--gold-border);
            color: var(--gold);
        }
        .day-tab .badge {
            display: inline-block; margin-left: 6px;
            background: var(--gold); color: #000;
            font-size: 0.6rem; font-weight: 600;
            padding: 1px 5px; border-radius: 99px; vertical-align: middle;
        }
        .day-tab:not(.active) .badge {
            background: #222; color: var(--text-muted);
        }

        /* FORM */
        .form-section {
            border: 1px solid var(--gold-border);
            background: var(--surface);
            padding: 28px 32px;
            margin-bottom: 36px;
        }
        .form-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .form-section h2 {
            font-size: 0.65rem; font-weight: 500;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--gold);
        }

        .cat-select-row {
            display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .cat-opt {
            padding: 5px 12px; border: 1px solid #222;
            background: transparent; color: var(--text-muted);
            font-family: inherit; font-size: 0.72rem; cursor: pointer;
            transition: all 0.15s;
        }
        .cat-opt.selected {
            background: var(--gold-dim); border-color: var(--gold-border);
            color: var(--gold);
        }

        input, textarea {
            width: 100%; padding: 11px 14px;
            margin-bottom: 10px;
            background: var(--bg); color: var(--text);
            border: 1px solid #1c1c1c;
            font-size: 0.875rem; font-family: inherit; font-weight: 300;
            outline: none; transition: border-color 0.2s; border-radius: 0;
            -webkit-appearance: none;
        }
        input:focus, textarea:focus { border-color: var(--gold-border); }
        input[type="date"] { color-scheme: dark; }
        textarea { min-height: 100px; resize: vertical; }

        .form-footer {
            display: flex; align-items: center; gap: 10px; margin-top: 4px;
        }

        #charCount {
            font-size: 0.7rem; color: var(--text-muted); margin-left: auto;
        }

        button { border-radius: 0; }

        .btn {
            padding: 10px 22px; border: none; cursor: pointer;
            font-size: 0.75rem; font-family: inherit; font-weight: 500;
            letter-spacing: 0.12em; text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--gold); color: #000; }
        .btn-primary:hover { background: var(--gold-light); }
        .btn-ghost {
            background: transparent; color: var(--text-muted);
            border: 1px solid #252525;
        }
        .btn-ghost:hover { border-color: #444; color: var(--text); }

        /* ENTRIES */
        .entries-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .section-label {
            font-size: 0.65rem; font-weight: 500;
            letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--text-muted);
        }

        #exportBtn {
            padding: 4px 12px; background: transparent;
            border: 1px solid #1e1e1e; color: var(--text-muted);
            font-family: inherit; font-size: 0.68rem;
            letter-spacing: 0.08em; cursor: pointer;
            transition: all 0.15s;
        }
        #exportBtn:hover { border-color: #333; color: var(--text); }

        .entry {
            background: var(--surface);
            border: 1px solid #141414;
            border-left: 2px solid var(--gold);
            padding: 20px 24px;
            margin-bottom: 6px;
            transition: all 0.2s;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity:0; transform: translateY(8px); }
            to   { opacity:1; transform: translateY(0); }
        }
        .entry:hover { border-color: var(--gold-border); border-left-color: var(--gold); }

        .entry-top {
            display: flex; align-items: flex-start;
            justify-content: space-between; gap: 12px;
            margin-bottom: 4px;
        }
        .entry h3 {
            font-size: 0.95rem; font-weight: 500; color: var(--text);
        }
        .entry-cat {
            font-size: 0.62rem; font-weight: 500;
            letter-spacing: 0.08em; text-transform: uppercase;
            padding: 2px 8px; border: 1px solid var(--gold-border);
            color: var(--gold); white-space: nowrap; flex-shrink: 0;
        }
        .entry .date {
            color: var(--text-muted); font-size: 0.72rem;
            letter-spacing: 0.04em; margin-bottom: 10px;
        }
        .entry .body {
            font-size: 0.875rem; font-weight: 300;
            color: #888; line-height: 1.75;
        }
        .entry .actions {
            margin-top: 14px; display: flex; gap: 6px;
        }
        .edit-btn {
            padding: 5px 12px; background: transparent;
            border: 1px solid var(--gold-border); color: var(--gold);
            font-family: inherit; font-size: 0.68rem;
            letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer; transition: all 0.15s;
        }
        .edit-btn:hover { background: var(--gold-dim); }
        .delete-btn {
            padding: 5px 12px; background: transparent;
            border: 1px solid #1e1e1e; color: #555;
            font-family: inherit; font-size: 0.68rem;
            letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer; transition: all 0.15s;
        }
        .delete-btn:hover { border-color: #8b2e2e; color: #c0392b; }

        .empty {
            text-align: center; color: var(--text-muted);
            padding: 60px 0; font-size: 0.82rem;
            letter-spacing: 0.06em;
        }

        /* TOAST */
        #toast {
            position: fixed; bottom: 32px; right: 32px;
            background: var(--gold); color: #000;
            padding: 10px 20px; font-size: 0.78rem;
            font-weight: 500; letter-spacing: 0.08em;
            opacity: 0; transform: translateY(10px);
            transition: all 0.3s; pointer-events: none;
            z-index: 999;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #222; }
    </style>
</head>
<body>

<!-- ══════════ INTRO ══════════ -->
<div id="intro">
    <!-- particles -->
    <div class="particle" style="width:4px;height:4px;left:20%;bottom:10%;animation-delay:0s;animation-duration:2.8s"></div>
    <div class="particle" style="width:3px;height:3px;left:35%;bottom:5%;animation-delay:0.5s;animation-duration:3.2s"></div>
    <div class="particle" style="width:5px;height:5px;left:55%;bottom:8%;animation-delay:1s;animation-duration:2.5s"></div>
    <div class="particle" style="width:3px;height:3px;left:70%;bottom:12%;animation-delay:0.3s;animation-duration:3.5s"></div>
    <div class="particle" style="width:4px;height:4px;left:80%;bottom:6%;animation-delay:1.5s;animation-duration:2.9s"></div>
    <div class="particle" style="width:3px;height:3px;left:10%;bottom:15%;animation-delay:0.8s;animation-duration:3.1s"></div>
    <div class="particle" style="width:6px;height:6px;left:45%;bottom:3%;animation-delay:1.2s;animation-duration:2.7s"></div>
    <div class="particle" style="width:3px;height:3px;left:88%;bottom:9%;animation-delay:0.2s;animation-duration:3.3s"></div>

    <h2>Ваш счёт сегодня</h2>
    <div id="roulette-wrap">
        <canvas id="roulette-canvas" width="260" height="260"></canvas>
    </div>
    <div id="reveal-number">67</div>
    <div id="reveal-label">Ваш личный номер удачи</div>
    <button id="intro-skip" onclick="exitIntro()">Войти на сайт</button>
</div>

<!-- ══════════ DANCER ══════════ -->
<div class="dancer-wrap" id="dancer" title="Это я, танцую за тебя 🕺">
    <!-- pose A -->
    <svg class="pose-a" viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
        <!-- head -->
        <circle cx="20" cy="7" r="6" fill="none" stroke="#C9A84C" stroke-width="2"/>
        <!-- body -->
        <line x1="20" y1="13" x2="20" y2="34" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <!-- left arm up -->
        <line x1="20" y1="18" x2="6" y2="10" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <!-- right arm down -->
        <line x1="20" y1="18" x2="35" y2="28" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <!-- left leg -->
        <line x1="20" y1="34" x2="10" y2="52" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <!-- right leg -->
        <line x1="20" y1="34" x2="30" y2="50" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <!-- left foot -->
        <line x1="10" y1="52" x2="4" y2="50" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <!-- right foot -->
        <line x1="30" y1="50" x2="36" y2="52" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <!-- pose B (alt) -->
    <svg class="pose-b" viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="7" r="6" fill="none" stroke="#C9A84C" stroke-width="2"/>
        <line x1="20" y1="13" x2="20" y2="34" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <!-- left arm down -->
        <line x1="20" y1="18" x2="5" y2="28" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <!-- right arm up -->
        <line x1="20" y1="18" x2="35" y2="10" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <!-- left leg out -->
        <line x1="20" y1="34" x2="8" y2="50" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <!-- right leg straight -->
        <line x1="20" y1="34" x2="26" y2="54" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
        <!-- left foot -->
        <line x1="8" y1="50" x2="2" y2="48" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
        <!-- right foot -->
        <line x1="26" y1="54" x2="33" y2="54" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="dancer-label">67</div>
</div>

<!-- ══════════ MAIN APP ══════════ -->
<div id="main-app">
<div class="container">

    <header>
        <div class="header-deco"><h1>Мой прогресс</h1></div>
        <p class="header-sub">Трекер достижений и навыков</p>
        <div class="level-badge">
            <span id="levelName">Новичок</span>
            <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xpBar" style="width:0%"></div></div>
            <span id="xpText" style="font-size:0.65rem;color:var(--text-muted)">0 / 5</span>
        </div>
    </header>

    <div class="stats">
        <div class="stat-cell">
            <span class="stat-number" id="totalCount">0</span>
            <span class="stat-label">записей</span>
        </div>
        <div class="stat-cell">
            <span class="stat-number" id="todayCount">0</span>
            <span class="stat-label">сегодня</span>
        </div>
        <div class="stat-cell">
            <span class="stat-number" id="streakCount">0</span>
            <span class="stat-label">дней подряд</span>
        </div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Поиск по записям..." oninput="renderEntries()">
    </div>

    <!-- Category filter -->
    <div class="cat-filter">
        <button class="cat-pill active" data-cat="all" onclick="setCatFilter(this,'all')">Все</button>
        <button class="cat-pill" data-cat="Учёба" onclick="setCatFilter(this,'Учёба')">📚 Учёба</button>
        <button class="cat-pill" data-cat="Проект" onclick="setCatFilter(this,'Проект')">🛠️ Проект</button>
        <button class="cat-pill" data-cat="Победа" onclick="setCatFilter(this,'Победа')">🏆 Победа</button>
        <button class="cat-pill" data-cat="Идея" onclick="setCatFilter(this,'Идея')">💡 Идея</button>
        <button class="cat-pill" data-cat="Другое" onclick="setCatFilter(this,'Другое')">✏️ Другое</button>
    </div>

    <!-- Day tabs -->
    <div class="day-tabs-wrap">
        <div class="day-tabs" id="dayTabs"></div>
    </div>

    <!-- Form -->
    <div class="form-section">
        <div class="form-header">
            <h2 id="formTitle">Добавить запись</h2>
        </div>

        <!-- Category selector -->
        <div class="cat-select-row">
            <button class="cat-opt selected" data-val="Учёба" onclick="selectCat(this)">📚 Учёба</button>
            <button class="cat-opt" data-val="Проект" onclick="selectCat(this)">🛠️ Проект</button>
            <button class="cat-opt" data-val="Победа" onclick="selectCat(this)">🏆 Победа</button>
            <button class="cat-opt" data-val="Идея" onclick="selectCat(this)">💡 Идея</button>
            <button class="cat-opt" data-val="Другое" onclick="selectCat(this)">✏️ Другое</button>
        </div>

        <input type="date" id="entryDate">
        <input type="text" id="entryTitle" placeholder="Заголовок — например: Сделал Telegram бота">
        <textarea id="entryText" placeholder="Что сделал, что узнал, какие проблемы решил..." oninput="updateCharCount()"></textarea>

        <div class="form-footer">
            <button class="btn btn-primary" onclick="saveEntry()" id="saveBtn">Сохранить</button>
            <button class="btn btn-ghost" onclick="cancelEdit()" id="cancelBtn" style="display:none">Отмена</button>
            <span id="charCount">0 симв.</span>
        </div>
    </div>

    <!-- Entries -->
    <div class="entries-header">
        <span class="section-label" id="entriesLabel">Записи</span>
        <button id="exportBtn" onclick="exportEntries()">Экспорт ↓</button>
    </div>
    <div id="entriesList"></div>

</div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// ROULETTE
// ═══════════════════════════════════════════
(function() {
    const canvas = document.getElementById('roulette-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2;
    const outerR = W/2 - 6;
    const innerR = outerR * 0.22;

    // Numbers on wheel — 67 at index 0
    const nums = [67, 0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10];
    const N = nums.length;
    const segAngle = (2 * Math.PI) / N;

    function segColor(n, i) {
        if (n === 67) return '#C9A84C';
        if (n === 0)  return '#1a4020';
        return i % 2 === 0 ? '#1a0000' : '#0d0d0d';
    }

    function drawWheel(angle) {
        ctx.clearRect(0, 0, W, H);

        // outer ring
        ctx.beginPath();
        ctx.arc(cx, cy, outerR + 4, 0, 2*Math.PI);
        ctx.fillStyle = '#1a1508';
        ctx.fill();

        for (let i = 0; i < N; i++) {
            const a1 = angle + i * segAngle;
            const a2 = a1 + segAngle;

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, outerR, a1, a2);
            ctx.closePath();
            ctx.fillStyle = segColor(nums[i], i);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // number
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(a1 + segAngle / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = nums[i] === 67 ? '#000' : '#ddd';
            ctx.font = `${nums[i] === 67 ? 'bold' : '400'} 11px Inter`;
            ctx.fillText(nums[i], outerR - 8, 4);
            ctx.restore();
        }

        // inner hub
        ctx.beginPath();
        ctx.arc(cx, cy, innerR, 0, 2*Math.PI);
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, innerR);
        grad.addColorStop(0, '#1a1508');
        grad.addColorStop(1, '#0d0d00');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = '#C9A84C';
        ctx.lineWidth = 2;
        ctx.stroke();

        // gold dots on rim
        for (let i = 0; i < N; i++) {
            const a = angle + i * segAngle;
            const dx = Math.cos(a) * outerR;
            const dy = Math.sin(a) * outerR;
            ctx.beginPath();
            ctx.arc(cx + dx, cy + dy, 3, 0, 2*Math.PI);
            ctx.fillStyle = '#C9A84C';
            ctx.fill();
        }
    }

    // Animation: land 67 (index 0) at top (-π/2)
    // Center of seg 0 = angle + segAngle/2 = -π/2
    // angle = -π/2 - segAngle/2
    const finalAngle = -Math.PI/2 - segAngle/2;
    const totalSpin  = finalAngle + 7 * 2 * Math.PI; // 7 full spins then land
    const duration   = 4200;
    let startTime    = null;

    function easeOut(t) {
        return 1 - Math.pow(1 - t, 4);
    }

    function animate(ts) {
        if (!startTime) startTime = ts;
        const elapsed  = ts - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const angle    = totalSpin * easeOut(progress);
        drawWheel(angle);

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            drawWheel(finalAngle); // exact final frame
            onWheelDone();
        }
    }

    requestAnimationFrame(animate);

    window.onWheelDone = function() {
        const num  = document.getElementById('reveal-number');
        const lbl  = document.getElementById('reveal-label');
        const btn  = document.getElementById('intro-skip');
        num.classList.add('show');
        lbl.classList.add('show');
        btn.classList.add('show');
        // auto-exit after 3s
        setTimeout(exitIntro, 3000);
    };
})();

function exitIntro() {
    const intro = document.getElementById('intro');
    intro.classList.add('fade-out');
    setTimeout(() => {
        intro.style.display = 'none';
        document.getElementById('main-app').classList.add('visible');
    }, 800);
}

// ═══════════════════════════════════════════
// DANCER alt-pose toggle
// ═══════════════════════════════════════════
setInterval(() => {
    document.getElementById('dancer').classList.toggle('alt');
}, 210);

// ═══════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════
const STORAGE_KEY = 'my-progress-entries';
let editingId     = null;
let activeDay     = 'all';
let activeCat     = 'all';
let selectedCat   = 'Учёба';

const LEVELS = [
    { name:'Новичок',    min:0,  max:5  },
    { name:'Практик',    min:5,  max:15 },
    { name:'Мастер',     min:15, max:30 },
    { name:'Эксперт',    min:30, max:Infinity },
];

const SAMPLE_ENTRIES = [
    { id:'s1', date:'2026-06-15', category:'Проект',  title:'Создал Telegram-бота с ИИ', text:'Сделал бота на Python + aiogram. Подключил Groq, OpenRouter, Together, HuggingFace, Cerebras. Задеплоил на bothost.ru.' },
    { id:'s2', date:'2026-06-15', category:'Победа',  title:'Настроил стиль бота под Мелстроя', text:'Добавил системный промпт, few-shot примеры с мемными фразами. Бот теперь говорит: беды, друн, нормалды, масса.' },
    { id:'s3', date:'2026-06-15', category:'Учёба',   title:'Сделал сайт с планом обучения', text:'Создал HTML-сайт с 2-недельным планом по изучению AI-ботов, полезными ссылками и инструкциями.' },
];

function getEntries() {
    const d = localStorage.getItem(STORAGE_KEY);
    if (d) return JSON.parse(d);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(SAMPLE_ENTRIES));
    return SAMPLE_ENTRIES;
}
function saveEntries(e) { localStorage.setItem(STORAGE_KEY, JSON.stringify(e)); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function fmtDate(s) { return new Date(s).toLocaleDateString('ru-RU', { year:'numeric', month:'long', day:'numeric' }); }
function esc(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

function selectCat(btn) {
    document.querySelectorAll('.cat-opt').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCat = btn.dataset.val;
}

function setCatFilter(btn, cat) {
    document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = cat;
    renderEntries();
}

function updateCharCount() {
    const len = document.getElementById('entryText').value.length;
    document.getElementById('charCount').textContent = len + ' симв.';
}

function saveEntry() {
    const date  = document.getElementById('entryDate').value;
    const title = document.getElementById('entryTitle').value.trim();
    const text  = document.getElementById('entryText').value.trim();
    if (!date || !title || !text) { showToast('Заполни все поля'); return; }

    let entries = getEntries();
    if (editingId) {
        const idx = entries.findIndex(e => e.id === editingId);
        if (idx !== -1) entries[idx] = { id:editingId, date, category:selectedCat, title, text };
        editingId = null;
    } else {
        entries.push({ id:genId(), date, category:selectedCat, title, text });
    }
    saveEntries(entries);
    clearForm();
    renderEntries();
    showToast('Сохранено');
}

function deleteEntry(id) {
    if (!confirm('Удалить запись?')) return;
    saveEntries(getEntries().filter(e => e.id !== id));
    renderEntries();
    showToast('Удалено');
}

function editEntry(id) {
    const entry = getEntries().find(e => e.id === id);
    if (!entry) return;
    document.getElementById('entryDate').value  = entry.date;
    document.getElementById('entryTitle').value = entry.title;
    document.getElementById('entryText').value  = entry.text;
    updateCharCount();
    // set category
    document.querySelectorAll('.cat-opt').forEach(b => {
        b.classList.toggle('selected', b.dataset.val === (entry.category || 'Другое'));
    });
    selectedCat = entry.category || 'Другое';
    document.getElementById('formTitle').textContent  = 'Редактировать';
    document.getElementById('saveBtn').textContent    = 'Обновить';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    editingId = id;
    window.scrollTo({ top:0, behavior:'smooth' });
}

function cancelEdit() { clearForm(); }

function clearForm() {
    document.getElementById('entryDate').value  = new Date().toISOString().split('T')[0];
    document.getElementById('entryTitle').value = '';
    document.getElementById('entryText').value  = '';
    updateCharCount();
    document.getElementById('formTitle').textContent   = 'Добавить запись';
    document.getElementById('saveBtn').textContent     = 'Сохранить';
    document.getElementById('cancelBtn').style.display = 'none';
    editingId = null;
    document.querySelectorAll('.cat-opt').forEach((b,i) => b.classList.toggle('selected', i===0));
    selectedCat = 'Учёба';
}

function renderDayTabs() {
    const entries = getEntries();
    const dates   = [...new Set(entries.map(e => e.date))].sort().reverse();
    const wrap    = document.getElementById('dayTabs');
    const total   = entries.length;

    let html = `<button class="day-tab ${activeDay==='all'?'active':''}" onclick="setDay(this,'all')">
        Все <span class="badge">${total}</span></button>`;

    dates.forEach(d => {
        const count = entries.filter(e => e.date === d).length;
        const label = new Date(d).toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
        html += `<button class="day-tab ${activeDay===d?'active':''}" onclick="setDay(this,'${d}')">
            ${label} <span class="badge">${count}</span></button>`;
    });

    wrap.innerHTML = html;
}

function setDay(btn, day) {
    activeDay = day;
    renderEntries();
}

function renderEntries() {
    renderDayTabs();
    const query   = document.getElementById('searchInput').value.toLowerCase();
    let entries   = getEntries().sort((a,b) => new Date(b.date) - new Date(a.date));

    if (activeDay !== 'all') entries = entries.filter(e => e.date === activeDay);
    if (activeCat !== 'all') entries = entries.filter(e => (e.category||'Другое') === activeCat);
    if (query) entries = entries.filter(e =>
        e.title.toLowerCase().includes(query) || e.text.toLowerCase().includes(query));

    const container = document.getElementById('entriesList');

    if (entries.length === 0) {
        container.innerHTML = '<div class="empty">Ничего не найдено.</div>';
    } else {
        container.innerHTML = entries.map(entry => `
            <div class="entry">
                <div class="entry-top">
                    <h3>${esc(entry.title)}</h3>
                    <span class="entry-cat">${esc(entry.category||'Другое')}</span>
                </div>
                <div class="date">${fmtDate(entry.date)}</div>
                <div class="body">${esc(entry.text).replace(/\n/g,'<br>')}</div>
                <div class="actions">
                    <button class="edit-btn" onclick="editEntry('${entry.id}')">Редактировать</button>
                    <button class="delete-btn" onclick="deleteEntry('${entry.id}')">Удалить</button>
                </div>
            </div>`).join('');
    }

    updateStats();
}

function updateStats() {
    const entries = getEntries();
    const today   = new Date().toISOString().split('T')[0];
    const dates   = [...new Set(entries.map(e => e.date))].sort();
    let streak    = 0;

    if (dates.length > 0) {
        const check = new Date();
        if (dates.includes(today)) {
            streak = 1;
            while (true) {
                check.setDate(check.getDate() - 1);
                const ds = check.toISOString().split('T')[0];
                if (dates.includes(ds)) streak++;
                else break;
            }
        }
    }

    document.getElementById('totalCount').textContent = entries.length;
    document.getElementById('todayCount').textContent = entries.filter(e=>e.date===today).length;
    document.getElementById('streakCount').textContent = streak;
    updateLevel(entries.length);
}

function updateLevel(count) {
    let lv = LEVELS[0];
    for (const l of LEVELS) { if (count >= l.min) lv = l; }
    const next = LEVELS.find(l => l.min > count);
    const pct  = next ? Math.round(((count - lv.min) / (next.min - lv.min)) * 100) : 100;
    document.getElementById('levelName').textContent = lv.name;
    document.getElementById('xpBar').style.width     = pct + '%';
    document.getElementById('xpText').textContent    = next ? `${count} / ${next.min}` : `${count} макс.`;
}

function exportEntries() {
    const entries = getEntries().sort((a,b) => new Date(b.date) - new Date(a.date));
    const text = entries.map(e =>
        `[${e.date}] [${e.category||''}] ${e.title}\n${e.text}`
    ).join('\n\n---\n\n');
    navigator.clipboard.writeText(text).then(() => showToast('Скопировано в буфер'));
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
}

// Init
document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
renderEntries();
</script>
</body>
</html>
